server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    server_tokens off;

    # Health check para las probes de Kubernetes
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API: mismo origen → cookies first-party y sin CORS
    location /api/ {
        proxy_pass http://barber-back:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Service worker y manifest: siempre revalidar para que las actualizaciones lleguen al instante
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        include /etc/nginx/conf.d/security-headers.inc;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Assets con hash — cache agresivo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
