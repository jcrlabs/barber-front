name: Mobile Build

on:
  # Cada release genera también el APK; se puede lanzar a mano desde Actions.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - both

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      NAS_WEBDAV_USER: ${{ secrets.NAS_WEBDAV_USER }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgar-barber-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Publicamos la APK en la carpeta "barber" del NAS (Nextcloud), compartida con enlace público:
      # una copia por versión y "edgar-barber-latest.apk" siempre apuntando a la última.
      - name: Publish APK to NAS
        if: env.NAS_WEBDAV_USER != ''
        env:
          NAS_WEBDAV_PASSWORD: ${{ secrets.NAS_WEBDAV_PASSWORD }}
          NAS_DAV: https://nas.jcrlabs.net/remote.php/dav/files/${{ secrets.NAS_WEBDAV_USER }}/barber
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION="dev-${GITHUB_SHA::7}"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          for name in "edgar-barber-${VERSION}.apk" "edgar-barber-latest.apk"; do
            curl -fsS --retry 3 -u "$NAS_WEBDAV_USER:$NAS_WEBDAV_PASSWORD" -T "$APK" "$NAS_DAV/$name"
          done
          echo "APK publicada en el NAS: edgar-barber-${VERSION}.apk" >> "$GITHUB_STEP_SUMMARY"

  ios-build:
    name: Build iOS
    if: inputs.platform == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgar-barber-ios-debug
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 30
