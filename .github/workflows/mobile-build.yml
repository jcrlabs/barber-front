name: Mobile Build

on:
  # Cada release genera también el APK; se puede lanzar a mano desde Actions.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - both

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      NAS_WEBDAV_USER: ${{ secrets.NAS_WEBDAV_USER }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # APK de release firmada siempre con la misma clave: las versiones nuevas se instalan encima.
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$ANDROID_KEYSTORE_B64" ] || { echo "::error::Falta el secret ANDROID_KEYSTORE_B64"; exit 1; }
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            export APP_VERSION_NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            export APP_VERSION_CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            export APP_VERSION_NAME="0.0.0-dev" APP_VERSION_CODE=1
          fi
          ./gradlew assembleRelease
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgar-barber.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Publicamos la APK en la carpeta "barber" del NAS (Nextcloud), compartida con enlace público:
      # una copia por versión y "edgar-barber-latest.apk" siempre apuntando a la última.
      - name: Publish APK to NAS
        if: env.NAS_WEBDAV_USER != ''
        env:
          NAS_WEBDAV_PASSWORD: ${{ secrets.NAS_WEBDAV_PASSWORD }}
          NAS_DAV: https://nas.jcrlabs.net/remote.php/dav/files/${{ secrets.NAS_WEBDAV_USER }}/barber
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION="dev-${GITHUB_SHA::7}"
          APK=android/app/build/outputs/apk/release/app-release.apk
          for name in "edgar-barber-${VERSION}.apk" "edgar-barber-latest.apk"; do
            curl -fsS --retry 3 -u "$NAS_WEBDAV_USER:$NAS_WEBDAV_PASSWORD" -T "$APK" "$NAS_DAV/$name"
          done
          echo "APK publicada en el NAS: edgar-barber-${VERSION}.apk" >> "$GITHUB_STEP_SUMMARY"

  ios-build:
    name: Build iOS
    if: inputs.platform == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgar-barber-ios-debug
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 30
