name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b --noEmit

      - name: ESLint
        run: npm run lint

      - name: Audit (high+)
        run: npm audit --audit-level=high --omit=dev

      - name: Build
        run: npm run build

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: |
          helm lint deploy/helm -f deploy/helm/values.yaml -f deploy/helm/values-prod.yaml
          helm lint deploy/helm -f deploy/helm/values.yaml -f deploy/helm/values-test.yaml
